const lessons=[
{title:'El origen',icon:'🌋',sub:'De la química prebiótica a la célula eucariota',facts:[['Miller-Urey','Una descarga eléctrica en una mezcla de gases produjo moléculas orgánicas. Demuestra síntesis abiótica bajo ciertas condiciones; NO demuestra la aparición de vida ni reproduce necesariamente la atmósfera primitiva.'],['Hipótesis hidrotermal','Las fuentes hidrotermales ofrecen energía, minerales y gradientes químicos que podrían favorecer reacciones prebióticas. Que existan reacciones orgánicas no implica que haya organismos.'],['Mundo de ARN','El ARN puede almacenar información y algunas moléculas de ARN (ribozimas) catalizan reacciones. Esto hace plausible una etapa previa al sistema ADN-proteínas, pero no prueba que ocurriera así.'],['Protocélulas','Vesículas lipídicas pueden delimitar un interior y crecer o dividirse. Dividirse no basta: para considerar vida hay que analizar metabolismo, información heredable y reproducción con evolución.'],['LUCA','Último antepasado común universal de la vida actual. No es necesariamente el primer organismo vivo.'],['Oxigenación','La fotosíntesis oxigénica elevó el O₂: perjudicó a muchos anaerobios, permitió nuevas vías metabólicas y contribuyó a formar ozono estratosférico.'],['Endosimbiosis','Mitocondrias y cloroplastos proceden de bacterias incorporadas por células ancestrales. Evidencias: ADN propio, doble membrana, fisión y ribosomas bacterianos. El núcleo no queda explicado por esa misma evidencia.'],['Historia de la vida','Los indicios de vida antigua deben interpretarse con cautela; el registro fósil es incompleto. La diversificación cámbrica fue un aumento importante de diversidad animal, no la aparición de toda la vida.']]},
{title:'Las reglas de la evolución',icon:'🦎',sub:'Qué cambia, por qué y cómo',facts:[['Lamarck y Darwin','Lamarck propuso la transmisión de caracteres adquiridos; Darwin y Wallace explicaron la adaptación mediante selección de variaciones heredables preexistentes.'],['Población y evolución','Evolucionan las poblaciones: cambian las frecuencias de variantes hereditarias entre generaciones. Un individuo no evoluciona genéticamente durante su vida.'],['Mutación y recombinación','Las mutaciones surgen sin dirigirse a las necesidades del organismo; la recombinación redistribuye variantes. Ambas aportan variación genética.'],['Selección natural','Si una variante heredable aumenta supervivencia o reproducción en un ambiente, puede hacerse más frecuente. No es una elección consciente ni garantiza perfección.'],['Deriva genética','Cambio aleatorio de frecuencias génicas, especialmente intenso en poblaciones pequeñas; incluye efecto fundador y cuello de botella.'],['Flujo génico','Movimiento de alelos entre poblaciones mediante migración y reproducción; suele reducir diferencias genéticas entre ellas.'],['Plasticidad fenotípica','El ambiente puede modificar el aspecto de un individuo sin alterar las frecuencias alélicas de la población. No toda diferencia observada es evolución.']]},
{title:'Las pruebas y las especies',icon:'🦴',sub:'Cómo inferimos parentesco y cómo surgen especies',facts:[['Fósiles y estratos','En una secuencia sedimentaria no alterada, los estratos inferiores suelen ser más antiguos. Fallas, pliegues y retrabajo pueden alterar la interpretación.'],['Homología','Similitud por origen evolutivo común, aunque cambie la función (extremidades de vertebrados).'],['Analogía y convergencia','Similitud funcional surgida independientemente bajo presiones semejantes (forma hidrodinámica de tiburón y delfín). No demuestra parentesco cercano.'],['Evidencia molecular','Secuencias de ADN y proteínas, junto con anatomía, desarrollo y fósiles, ayudan a reconstruir relaciones evolutivas.'],['Especiación','La acumulación de aislamiento reproductivo puede originar especies. Barreras prezigóticas impiden fecundación; poszigóticas reducen viabilidad o fertilidad híbrida.'],['Alopatría y simpatría','Alopátrica: separación geográfica. Simpátrica: sin barrera geográfica, por ejemplo poliploidía en plantas.'],['Extinciones y radiaciones','Una extinción puede dejar nichos disponibles; los linajes supervivientes pueden diversificarse. No ocurre con una finalidad ni está garantizado.'],['Biodiversidad','Incluye diversidad genética, de especies y de ecosistemas. Fragmentación puede reducir flujo génico y aumentar riesgo de pérdida de diversidad.']]},
{title:'El árbol de la vida',icon:'🌳',sub:'Clasificar con parentesco evolutivo',facts:[['Taxonomía','Categorías jerárquicas: dominio, reino, filo, clase, orden, familia, género y especie. Un taxón es un grupo concreto, por ejemplo Felidae; «familia» es la categoría.'],['Nomenclatura binomial','Nombre científico: Género especie; género con mayúscula inicial y epíteto específico minúsculo, ambos en cursiva: Homo sapiens.'],['Cladogramas','Representan hipótesis de parentesco. Un nodo indica antepasado común hipotético; los grupos hermanos comparten el nodo más reciente. No son escalas de progreso.'],['Sinapomorfías','Caracteres derivados compartidos que apoyan un clado. Una pérdida secundaria de un carácter no elimina necesariamente el parentesco.'],['Tres dominios','Bacteria, Archaea y Eukarya. Archaea no tienen peptidoglucano bacteriano y poseen lípidos de membrana característicos; no todas viven en ambientes extremos.'],['Eucariotas','Incluyen animales, plantas, hongos y diversos linajes tradicionalmente agrupados como protistas. Un eucariota fotosintético unicelular no se clasifica automáticamente como planta.'],['Grandes grupos animales','Se reconocen por caracteres compartidos: poríferos, cnidarios, moluscos, anélidos, artrópodos, equinodermos y cordados, entre otros.'],['Claves dicotómicas','Identifican organismos mediante decisiones sucesivas entre dos alternativas basadas en caracteres observables; la identificación depende de que los caracteres estén bien definidos.']]},
{title:'Desafío final',icon:'🏆',sub:'Integración: interpretar, justificar y poner límites a la conclusión',facts:[['Método de respuesta','1. Identifica datos. 2. Enuncia el mecanismo causal. 3. Explica la consecuencia. 4. Delimita qué no puede concluirse.'],['Evita explicaciones finalistas','Incorrecto: «mutaron para sobrevivir». Correcto: «ya existían variantes resistentes y el insecticida favoreció su reproducción».'],['Distingue hipótesis y prueba','Una observación puede ser compatible con una hipótesis sin demostrarla por sí sola. Busca explicaciones alternativas y evidencia adicional.'],['Criterios de clasificación','No basta la apariencia: combina características heredadas, datos moleculares y posición en el árbol evolutivo.']]}
];

const key='evolucion_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let state={view:'home',mission:0,qi:0,answered:false,caseIndex:0,showSolution:false,selected:null};const app=document.getElementById('app');function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(view,m=state.mission){state={...state,view,mission:m,qi:0,answered:false,selected:null,showSolution:false};render();scrollTo(0,0)}function btn(text,fn,kind='secondary'){const b=document.createElement('button');b.className=kind;b.textContent=text;b.addEventListener('click',fn);return b}function mountButtons(id,items){const el=document.getElementById(id);items.forEach(x=>el.append(btn(...x)))}function countDone(){return Object.keys(saved).filter(k=>k.startsWith('q_')&&saved[k]===true).length}function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">Expedición científica · 1.º Bachillerato</div><h1>EVOLUCIÓN<br>El árbol de la vida</h1><p>Investiga las pistas. Explica los mecanismos. Aprende a distinguir evidencia de hipótesis.</p><div class="tags"><span class="tag">5 misiones</span><span class="tag">24 preguntas autocorregibles</span><span class="tag">20 retos escritos</span></div></section><section class="panel"><div class="quizhead"><h2>Tu expedición</h2><span class="result">${countDone()}/${qs.length} preguntas acertadas</span></div><div class="progress"><div style="width:${100*countDone()/qs.length}%"></div></div><p class="muted">Puedes comenzar por cualquier misión. Cada pregunta explica por qué una respuesta es correcta.</p><div class="cards" id="missions"></div></section><section class="panel"><h2>Simulacro de razonamiento</h2><p>20 situaciones nuevas o adaptadas al tipo de ejercicio de clase. Escribe tu respuesta antes de consultar la solución razonada.</p><div id="caseStart"></div></section>`;let c=document.getElementById('missions');lessons.forEach((m,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="num">0${i+1}</div><div class="symbol">${m.icon}</div><h3>${m.title}</h3><p>${m.sub}</p><div class="tags"><span class="tag">${m.facts.length} conceptos</span><span class="tag">${qs.filter(q=>q[0]===i).length} preguntas</span></div><div class="btnrow"></div>`;el.querySelector('.btnrow').append(btn('Entrar en misión',()=>go('lesson',i),'primary'));c.append(el)});document.getElementById('caseStart').append(btn('Comenzar simulacro',()=>go('cases',4),'primary'))}
function lesson(){const m=lessons[state.mission];app.innerHTML=`<section class="panel"><div class="eyebrow">Misión 0${state.mission+1}</div><h1>${m.icon} ${m.title}</h1><p class="muted">${m.sub}</p><div class="btnrow" id="lessonNav"></div></section><section class="panel"><h2>Cuaderno de investigación</h2><p>Lee cada explicación y pregúntate: ¿qué observamos, qué mecanismo proponemos y qué no podemos concluir?</p>${m.facts.map(([t,d],i)=>`<article class="lesson"><div class="eyebrow">Pista ${i+1}</div><h3>${escapeHtml(t)}</h3><p>${escapeHtml(d)}</p></article>`).join('')}</section><section class="panel"><h2>Ahora, aplica lo aprendido</h2><p>Las preguntas incluyen distractores que representan errores habituales de razonamiento.</p><div id="lessonEnd"></div></section>`;mountButtons('lessonNav',[['← Volver al mapa',()=>go('home')],['Practicar preguntas',()=>go('quiz',state.mission),'primary']]);mountButtons('lessonEnd',[['Ir a las preguntas',()=>go('quiz',state.mission),'primary'],['Resolver casos escritos',()=>go('cases',state.mission)]])}
function quiz(){const list=qs.map((q,i)=>({...{q},i})).filter(x=>x.q[0]===state.mission);if(state.qi>=list.length){app.innerHTML=`<section class="panel"><div class="symbol">🎉</div><h1>¡Misión completada!</h1><p>Has revisado todas las preguntas de esta misión. Lo importante es poder explicar el mecanismo, no solo recordar la opción.</p><div id="endButtons"></div></section>`;mountButtons('endButtons',[['Volver al mapa',()=>go('home'),'primary'],['Repetir preguntas',()=>go('quiz',state.mission)]]);return}const {q,i}=list[state.qi];app.innerHTML=`<section class="panel"><div class="eyebrow">Misión 0${state.mission+1} · Pregunta ${state.qi+1} de ${list.length}</div><div class="progress"><div style="width:${100*state.qi/list.length}%"></div></div><p class="question">${escapeHtml(q[1])}</p><div class="options" id="opts"></div><div id="feed"></div><div class="btnrow" id="quizNav"></div></section>`;q[2].forEach((o,j)=>{const b=btn(String.fromCharCode(65+j)+'. '+o,()=>choose(j,q,i),'option');b.dataset.choice=j;document.getElementById('opts').append(b)});mountButtons('quizNav',[['← Conceptos',()=>go('lesson',state.mission)],['Mapa',()=>go('home')]])}
function choose(j,q,i){if(state.answered)return;state.answered=true;state.selected=j;const correct=j===q[3];if(correct){saved['q_'+i]=true;persist()}document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add('good');else if(k===j)b.classList.add('bad')});const f=document.getElementById('feed');f.className='feedback';f.innerHTML=`<strong>${correct?'✓ Correcto':'✗ Todavía no'}</strong><p>${escapeHtml(q[4])}</p><p class="small">${correct?'La evidencia y el mecanismo están bien relacionados.':'Compara tu elección con la respuesta marcada en verde. La explicación debe descartar las alternativas.'}</p>`;f.append(btn('Siguiente pregunta →',()=>{state.qi++;state.answered=false;quiz()},'primary'))}
function cases(){let idx=state.caseIndex;if(idx>=caseList.length)idx=state.caseIndex=0;let [t,q,a]=caseList[idx];app.innerHTML=`<section class="panel"><div class="eyebrow">Laboratorio de razonamiento · Caso ${idx+1}/${caseList.length}</div><h2>${escapeHtml(t)}</h2><p class="question">${escapeHtml(q)}</p><label for="written" class="muted">Escribe una respuesta de 2–5 frases. Incluye datos, mecanismo y límites de la conclusión.</label><textarea id="written" class="answer" placeholder="Mi explicación científica es..."></textarea><div class="btnrow" id="caseBtns"></div><div id="solution" class="feedback hidden"><h3>Modelo de respuesta razonada</h3><p>${escapeHtml(a)}</p><div class="rubric"><strong>Autoevaluación (0–3)</strong><p>1 punto: utilizas datos relevantes. 1 punto: explicas un mecanismo correcto. 1 punto: delimitas la conclusión y evitas lenguaje finalista cuando corresponda.</p></div></div></section>`;mountButtons('caseBtns',[['Ver solución y rúbrica',()=>{document.getElementById('solution').classList.remove('hidden');state.showSolution=true},'primary'],['← Anterior',()=>{state.caseIndex=(state.caseIndex+caseList.length-1)%caseList.length;casesView()}],['Siguiente →',()=>{state.caseIndex=(state.caseIndex+1)%caseList.length;casesView()}],['Mapa',()=>go('home')]])}function casesView(){cases();scrollTo(0,0)}function render(){if(state.view==='home')home();else if(state.view==='lesson')lesson();else if(state.view==='quiz')quiz();else cases()}document.getElementById('homeBtn').addEventListener('click',()=>go('home'));document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('¿Borrar las respuestas acertadas guardadas en este navegador?')){saved={};persist();go('home')}});render();
</script></body></html>
