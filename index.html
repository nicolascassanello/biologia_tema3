'use strict';
/* ===== Contenidos (basados en los apuntes y la presentación de la profesora) ===== */
const lessons=[
{title:'El origen',icon:'🌋',sub:'De la química prebiótica a la célula eucariota · Bloque A',facts:[
['Una transición gradual','La ciencia investiga el origen de la vida mediante hipótesis comprobables sobre una transición gradual: química no biológica → moléculas orgánicas → sistemas con metabolismo → sistemas con metabolismo, herencia y reproducción con variación. No existe una secuencia completa demostrada y las hipótesis principales son compatibles entre sí.'],
['Miller y Urey','En determinadas condiciones, a partir de sustancias simples y una fuente de energía se formaron aminoácidos. Demuestra síntesis prebiótica de algunos componentes de la vida; NO fabricó vida ni reprodujo con certeza toda la atmósfera primitiva.'],
['Fuentes hidrotermales','Sus gradientes de temperatura y composición química, junto con superficies minerales, pudieron aportar energía, concentrar moléculas y favorecer reacciones. Un conjunto de reacciones sobre un mineral todavía no es un ser vivo: falta un sistema que conserve información, se mantenga y se reproduzca con variación.'],
['Mundo de ARN','El ARN pudo desempeñar dos funciones que hoy están repartidas: almacenar información y catalizar reacciones. Algunas moléculas de ARN, las ribozimas, tienen actividad catalítica. Después, el ADN resultó más adecuado para almacenar información estable y las proteínas se especializaron como catalizadores.'],
['Protocélulas','Algunos lípidos forman vesículas espontáneamente en el agua y separan un interior del medio. Esa compartimentación permite concentrar moléculas y coordinar reacciones. Una vesícula que solo crece o se divide físicamente no es una célula si carece de metabolismo y de un sistema de herencia.'],
['LUCA','Último antepasado común universal: la población ancestral de la que proceden los organismos actuales. No fue necesariamente el primer ser vivo ni una especie aislada. Ya poseía código genético, ribosomas, membrana y un metabolismo complejo.'],
['Primeras huellas e Isua','Las primeras señales aceptadas de vida tienen más de 3500 Ma; las fechas son aproximadas porque el registro es incompleto. En las rocas de Isua (Groenlandia) se estudia la proporción ¹²C/¹³C: es una señal química indirecta, no un fósil visible, y su interpretación es debatida.'],
['Gran Oxidación y ozono','Al principio casi no había O₂ libre: los primeros organismos debieron ser anaerobios. La fotosíntesis oxigénica de antepasados de las cianobacterias liberó O₂, que se acumuló (Gran Oxidación, ≈2400 Ma). Perjudicó a muchos anaerobios y favoreció la respiración aerobia, que obtiene mucha más energía. Parte del O₂ formó ozono (O₃), que absorbe la radiación UV que daña el ADN y facilitó la expansión hacia ambientes superficiales y terrestres.'],
['Eucariotas, pluricelularidad y Cámbrico','Los eucariotas aparecieron mucho después que los procariotas. La pluricelularidad evolucionó de forma independiente en distintos linajes. Hace unos 541 Ma, en el Cámbrico, aumentó mucho la variedad de planes corporales animales, bien representados en el registro gracias a las estructuras duras. NO significa que todos los animales aparecieran de repente.'],
['Teoría endosimbiótica','Lynn Margulis: mitocondrias y cloroplastos proceden de bacterias incorporadas por una célula ancestral. La mitocondria deriva de una bacteria aerobia y el cloroplasto de una cianobacteria. Evidencias: ADN propio, generalmente circular; ribosomas 70S; división por fisión; doble membrana; y, la más concluyente, las comparaciones moleculares de sus genes. NO explica de forma demostrada el origen del núcleo ni del sistema de endomembranas.']]},
{title:'Las reglas de la evolución',icon:'🦎',sub:'Qué cambia, por qué y cómo · Bloque B',facts:[
['Población y evolución','Población: individuos de la misma especie que viven en un área y un periodo determinados y entre los que puede existir reproducción. Evolución: cambio de las características hereditarias de una población a lo largo de generaciones. Los individuos nacen y mueren; las poblaciones evolucionan.'],
['Hecho y teoría','Que las poblaciones han evolucionado y comparten antepasados es un hecho respaldado por numerosas observaciones. Las teorías evolutivas son explicaciones científicas contrastables de cómo ocurre ese cambio: en ciencia, teoría no significa suposición sin pruebas.'],
['Variabilidad','Los individuos de una población no son idénticos. Algunas diferencias se deben a los genes, otras al ambiente y muchas a la interacción entre ambos. Solo la parte heredable puede transmitirse y contribuir directamente al cambio evolutivo. Un cambio inducido por el ambiente en un individuo no es evolución.'],
['Fijismo y Lamarck','El fijismo consideraba inmutables las especies. Lamarck defendió que las especies cambian: el uso de un órgano lo desarrolla, el desuso lo reduce, y esos cambios adquiridos se heredarían (la jirafa que estira el cuello). Su mérito fue reconocer la transformación, pero desarrollar un rasgo durante la vida no cambia los alelos de los gametos.'],
['Darwin y Wallace','Propusieron independientemente la selección natural (El origen de las especies, 1859). Cuatro pasos: 1) hay variación entre individuos; 2) parte es heredable; 3) nacen más descendientes de los que pueden sobrevivir y reproducirse; 4) los portadores de ciertos rasgos dejan, en promedio, más descendientes y esos rasgos aumentan en la población.'],
['Selección natural','Ocurre cuando las diferencias heredables se asocian a distinto éxito de supervivencia o reproducción. El ambiente actúa como agente de selección, pero no fabrica la mutación que el organismo necesita. Una adaptación es un rasgo favorecido en un ambiente concreto: no es absoluta.'],
['Teoría sintética (neodarwinismo)','Integra selección natural, genética mendeliana y genética de poblaciones. Mutación: origina alelos nuevos de forma no dirigida (perjudicial, neutra o ventajosa según el ambiente). Recombinación y reproducción sexual: nuevas combinaciones de alelos. Selección natural. Flujo génico: entrada o salida de alelos por migración y reproducción; reduce diferencias entre poblaciones. Selección sexual: diferencias de apareamiento asociadas a rasgos heredables (cantos, coloración).'],
['Deriva genética','Cambio al azar en la frecuencia de los alelos de una generación a otra; no ocurre porque un alelo sea mejor. Es especialmente importante en poblaciones pequeñas, donde un alelo puede desaparecer por completo.'],
['Ritmo evolutivo','La evolución no tiene velocidad constante: puede haber largos periodos de estabilidad y episodios de cambio relativamente rápido. Puede observarse mientras ocurre: resistencia a antibióticos y pesticidas o cambios en el pico de los pinzones.'],
['Selección artificial','Las personas eligen qué organismos se reproducen según rasgos de interés. En la selección natural, el éxito reproductivo depende de la interacción con el ambiente. Ambas cambian frecuencias hereditarias, pero el agente de selección es distinto.']]},
{title:'Las pruebas y las especies',icon:'🦴',sub:'Evidencias, especiación y biodiversidad · Bloques B y C',facts:[
['Evidencias paleontológicas','Los fósiles son restos, moldes, huellas o señales de actividad. La posición estratigráfica da edades relativas y la datación radiométrica, edades numéricas. Hay formas con combinaciones de caracteres, como Archaeopteryx (entre dinosaurios terópodos y aves). Las series de los équidos son árboles con ramas y extinciones, no escaleras. Fosilizar es excepcional: la ausencia de un fósil no demuestra que el organismo no existiera.'],
['Homología, analogía y vestigios','Homóloga: mismo origen evolutivo y plan estructural, aunque cambie la función; evolución divergente (brazo humano, ala de murciélago, aleta de ballena). Análoga: función o aspecto semejante con origen distinto; convergencia (ala de ave y de insecto). Vestigial: resto reducido de una estructura funcional en antepasados (pelvis de ballenas). Las homologías informan sobre parentesco; las analogías no.'],
['Evidencias biogeográficas','La distribución de los organismos cuenta su historia. El aislamiento por océanos, cordilleras o fragmentación continental explica los endemismos. Las especies de islas suelen parecerse a las del continente más cercano, pero han divergido tras colonizar ambientes distintos.'],
['Evidencias moleculares','Todos los seres vivos usan ADN, ARN, ribosomas y un código casi universal. Al comparar secuencias homólogas, cuanto más reciente es el antepasado común, mayor suele ser la similitud. Ejemplo: 4 diferencias entre A y B, 11 entre A y C y 12 entre B y C → A y B comparten el antepasado más reciente; A no desciende de B. Reloj molecular: calibrado con fósiles, estima cuándo divergieron dos linajes, siempre como intervalo.'],
['¿Qué es una especie?','Concepto biológico: poblaciones cuyos individuos pueden reproducirse entre sí en condiciones naturales y producir descendencia fértil, aisladas reproductivamente de otras. Morfológico: por caracteres observables (útil en fósiles; falla con el pavo real). Filogenético: por ascendencia común, caracteres derivados y ADN. Ecológico: por el nicho. Ningún criterio funciona igual en todos los casos. La mula es un híbrido generalmente estéril; existen híbridos fértiles.'],
['Especiación','Una población origina dos especies cuando disminuye el flujo génico entre dos grupos y cada uno acumula cambios. Alopátrica: con separación geográfica (cordillera, río, isla). Simpátrica: en la misma zona, por nichos distintos, conductas reproductivas diferentes (cantos de cortejo) o, en plantas, poliploidía (aumento del número de juegos de cromosomas).'],
['Barreras reproductivas','Precigóticas (antes de la fecundación): ecológica o de hábitat (viven o se reproducen en ambientes distintos); temporal (se reproducen en momentos diferentes); etológica (señales de cortejo distintas); mecánica (estructuras reproductoras incompatibles); gamética (los gametos no se reconocen o no se fusionan). Postcigóticas (tras formarse el cigoto): el híbrido no se desarrolla, es estéril o poco viable, como la mula.'],
['Extinción K-Pg y radiación evolutiva','Hace unos 66 Ma, al final del Cretácico, el impacto de un asteroide en Chicxulub (Yucatán) provocó incendios, tsunamis y polvo que redujo la luz solar. Desapareció alrededor del 75 % de las especies, incluidos los dinosaurios no avianos. Aves, mamíferos, cocodrilos y tortugas sobrevivieron y se diversificaron al quedar nichos disponibles: una radiación evolutiva, sin finalidad.'],
['Biodiversidad y conservación','Incluye diversidad genética (alelos y genotipos dentro de la especie), de especies (riqueza: número de especies; y abundancia relativa) y de ecosistemas, con sus interacciones. Conservar no es salvar individuos aislados: hay que mantener poblaciones grandes y conectadas (corredores) para conservar su diversidad genética.']]},
{title:'El árbol de la vida',icon:'🌳',sub:'Clasificar con parentesco evolutivo · Bloque D',facts:[
['Criterios de clasificación','Clasificar es agrupar organismos con criterios explícitos: objetivos (observables o medibles), discriminatorios (permiten diferenciar) y reproducibles (otra persona obtiene lo mismo). Las clasificaciones actuales intentan reflejar la filogenia y dan importancia a los caracteres homólogos y a los datos moleculares.'],
['Sistemática, taxonomía y nomenclatura','La sistemática estudia la diversidad y reconstruye relaciones evolutivas. La taxonomía describe, identifica y organiza. La nomenclatura fija las reglas internacionales de los nombres científicos. La filogenia es la historia evolutiva y el parentesco de un grupo.'],
['Categorías y taxones','Linneo: dominio → reino → filo (división en botánica) → clase → orden → familia → género → especie; con prefijos (superfamilia, subespecie). Una categoría es un nivel; un taxón es el grupo concreto en ese nivel. Ser humano: Eukarya, Animalia, Chordata, Mammalia, Primates, Hominidae, Homo, Homo sapiens. Romero: Eukarya, Plantae, Tracheophyta, Magnoliopsida, Lamiales, Lamiaceae, Salvia, Salvia rosmarinus.'],
['Nomenclatura binomial','Género + epíteto específico, ambos en cursiva (a mano, cada palabra subrayada por separado); género con mayúscula y epíteto con minúscula: Canis lupus. Tras la primera mención puede abreviarse: C. lupus. El epíteto solo no es el nombre de la especie. La autoría y el año no van en cursiva: Canis lupus Linnaeus, 1758.'],
['Historia de las clasificaciones','Aristóteles (animales) y Teofrasto (plantas) usaban rasgos visibles. Linneo (s. XVIII) estableció la jerarquía y el binomio. Haeckel propuso Protista (1866); Copeland separó Monera; Whittaker popularizó los cinco reinos (1969); Margulis y Schwartz lo desarrollaron. Woese, comparando ARN ribosómico, propuso los tres dominios. No hay un único reparto de eucariotas en reinos aceptado por todos.'],
['Cinco reinos y Monera','Monera, Protoctista, Fungi, Plantae y Animalia, según tipo celular, organización y nutrición. Monera reunía a todos los procariotas, pero son dos linajes muy distintos (Bacteria y Archaea): hoy no se considera un reino válido. Protoctista es una agrupación didáctica, no un clado. Tamaño orientativo: procariotas 1–10 μm, eucariotas 10–100 μm, pero el tamaño no basta para clasificar.'],
['Cladogramas','Raíz: antepasado común del conjunto. Rama: un linaje. Nudo: antepasado común hipotético donde se separaron dos linajes. Taxones terminales: extremos de las ramas. Lectura: busca el primer nudo común de dos taxones; el nudo más reciente indica parentesco más cercano; los caracteres situados antes de un nudo se esperan en todos sus descendientes, salvo pérdidas posteriores. Un clado incluye un antepasado y todos sus descendientes.'],
['Errores al leer árboles','El taxón de la izquierda no es el más primitivo. La cercanía horizontal no indica parentesco: solo cuenta el patrón de nudos. El árbol no es una escalera de progreso hacia los humanos. Una rama más larga no significa más cambio salvo que haya escala. Rotar ramas alrededor de un nudo no cambia el parentesco.'],
['Los tres dominios','Bacteria y Archaea: procariotas, sin núcleo ni orgánulos membranosos. Eukarya: núcleo y compartimentos. Pared: Bacteria, frecuentemente con peptidoglicano; Archaea, sin peptidoglicano; Eukarya, variable (celulosa en plantas, quitina en hongos, ausente en animales). Lípidos de membrana: enlaces éster en Bacteria y Eukarya; enlaces éter e isoprenoides en Archaea. Ribosomas: 70S en procariotas; 80S en el citosol eucariota.'],
['Dominio Bacteria','Procariotas unicelulares con enorme diversidad metabólica: autótrofas (carbono inorgánico) o heterótrofas; fotótrofas (luz) o quimiótrofas (reacciones químicas); aerobias o anaerobias. Cocos, bacilos, vibrios y espirilos describen la forma, no el parentesco. Algunas forman endosporas resistentes (no reproductoras). Se reproducen por fisión binaria e intercambian genes por transformación, transducción o conjugación.'],
['Dominio Archaea','Procariotas distintas de las bacterias: lípidos con enlaces éter y pared sin peptidoglicano. Parte de su maquinaria de replicación, transcripción y traducción se parece más a la de los eucariotas. Viven en océanos, suelos e intestinos además de ambientes extremos: no todas son extremófilas. Hay metanógenas, halófilas y termófilas.'],
['Protoctistas y hongos','Protoctistas: eucariotas que no son animales, plantas ni hongos; agrupación didáctica heterogénea. Protozoos: unicelulares heterótrofos (cilios, flagelos, pseudópodos). Algas: fotosintéticas, uni o pluricelulares, sin los tejidos de las plantas. Hongos: heterótrofos por absorción, pared de quitina, reserva de glucógeno; levaduras unicelulares o hifas que forman micelio; esporas. Líquenes: hongo + alga verde o cianobacteria. Micorrizas: hongo + raíces.'],
['Plantas y animales','Plantas: pluricelulares fotosintéticas, pared de celulosa, cloroplastos, almidón; se clasifican por vasos conductores, semillas, flores, fruto y número de cotiledones. Animales: pluricelulares heterótrofos por ingestión, sin pared, glucógeno. Filos: poríferos (poros, sin tejidos), cnidarios (simetría radial, cnidocitos), platelmintos (aplanados), nematodos (cilíndricos no segmentados), anélidos (metámeros), moluscos (pie, masa visceral, manto), artrópodos (exoesqueleto de quitina, apéndices articulados), equinodermos (sistema ambulacral) y cordados (notocorda).'],
['Clave dicotómica','Identifica ejemplares mediante parejas de alternativas excluyentes basadas en caracteres observables; no demuestra parentesco. Clave de clase: 1 acicular/escuamiforme → pino, limbo ancho → 2; 2 compuesta → fresno, simple → 3; 3 borde espinoso y coriácea → encina, no espinoso → 4; 4 nerviación paralela → lirio, reticulada → 5; 5 lobulada → higuera, no lobulada y estrecha → olivo. Registra siempre la ruta completa.'],
['Aplicaciones','Medicina: entender la resistencia a antibióticos. Epidemiología: filogenias de patógenos. Agricultura: selección artificial y conservación de diversidad genética. Ambiente: claves y códigos de barras de ADN para inventarios y especies invasoras. Clasificar bien permite proteger endemismos y no gestionar dos especies crípticas como una sola.']]},
{title:'Desafío final',icon:'🏆',sub:'Cómo responder como pide tu profesora',facts:[
['Objetivo de la profesora','Aplicar los contenidos del tema a situaciones nuevas, interpretar datos y justificar conclusiones mediante vocabulario científico preciso.'],
['1 · Usa los datos','No te limites a nombrar el concepto: identifica los datos del enunciado que justifican tu respuesta.'],
['2 · Conclusión o hipótesis','Diferencia lo que puede concluirse de lo que solo constituye una hipótesis compatible con los datos.'],
['3 · Causa → mecanismo → consecuencia','Relaciona causas, mecanismos y consecuencias. Evita expresiones finalistas. Incorrecto: «mutaron para sobrevivir». Correcto: «ya existían variantes resistentes y el insecticida favoreció su reproducción».'],
['4 · Evidencias y ejemplos','Utiliza ejemplos o evidencias del tema cuando ayuden a justificar la explicación (antibióticos, pinzones, mula, K-Pg, Archaeopteryx…).']]}
];

/* ===== Preguntas tipo test: [misión, enunciado, opciones, correcta, explicación] ===== */
const qs=[

const caseList=[
[0,1,'Miller y Urey','Un compañero afirma: «El experimento de Miller y Urey demostró cómo apareció la primera célula». Evalúa esta afirmación. Explica qué demostró realmente el experimento y señala dos pasos necesarios entre la formación de moléculas orgánicas sencillas y la aparición de un sistema vivo.',
['Síntesis prebiótica; la transición gradual hacia la vida.','La palabra clave es «demostró»: compárala con lo que se obtuvo realmente (aminoácidos).','Moléculas orgánicas → sistema que guarde información y catalice (mundo de ARN) → compartimento con metabolismo y herencia (protocélula).','No reprodujo con certeza la atmósfera primitiva ni creó vida: es una prueba de que algunos componentes pueden formarse por procesos químicos.'],
'La afirmación es incorrecta. El experimento demostró que, en determinadas condiciones, a partir de sustancias simples y una fuente de energía pueden formarse moléculas orgánicas sencillas, como aminoácidos, sin intervención de seres vivos. No fabricó vida ni una célula, y tampoco reprodujo con certeza toda la atmósfera primitiva. Entre esas moléculas y un sistema vivo faltan, al menos, dos pasos: 1) la aparición de un sistema capaz de almacenar información y catalizar reacciones, como propone la hipótesis del mundo de ARN (ribozimas); y 2) la compartimentación en protocélulas, vesículas lipídicas que separan un interior del medio, acompañada de metabolismo y de un sistema de herencia que permita reproducirse con variación.',
'Decir que Miller y Urey «crearon vida» o que reprodujeron exactamente la atmósfera primitiva.'],
[0,2,'Fuente hidrotermal','En una superficie mineral próxima a una fuente hidrotermal se producen reacciones químicas de forma continua y se acumulan moléculas orgánicas. Razona por qué este sistema podría ser relevante para investigar el origen de la vida, pero no puede considerarse todavía un ser vivo.',
['Hipótesis hidrotermal y de superficies minerales; propiedades de un ser vivo.','Reacciones continuas y acumulación de moléculas orgánicas.','Gradientes de temperatura y composición → energía, concentración de moléculas y reacciones favorecidas.','Un conjunto de reacciones no conserva información ni se reproduce con variación: es un escenario compatible, no un organismo.'],
'Es relevante porque los gradientes de temperatura y de composición química de las fuentes hidrotermales y las superficies minerales pudieron aportar energía, concentrar moléculas y favorecer reacciones; el enunciado lo refleja: hay reacciones continuas y se acumulan moléculas orgánicas. Sin embargo, no es un ser vivo: un conjunto de reacciones sobre un mineral no constituye un sistema capaz de conservar información, mantenerse y reproducirse con variación. No hay herencia ni un compartimento propio. Es un escenario compatible con la hipótesis hidrotermal, no una prueba de que la vida surgiera allí.',
'Confundir reacciones químicas o acumulación de moléculas con metabolismo de un ser vivo.'],
[0,3,'Mundo de ARN','En el laboratorio se obtiene una molécula de ARN capaz de copiar parcialmente otra secuencia de ARN y de acelerar una reacción. Explica por qué este resultado apoya la hipótesis del mundo de ARN y por qué, aun así, no demuestra por sí solo que la vida comenzara de ese modo.',
['Hipótesis del mundo de ARN y ribozimas.','«Copiar parcialmente» (información) y «acelerar una reacción» (catálisis).','La hipótesis propone que el ARN tuvo dos funciones hoy repartidas entre ADN y proteínas; la molécula muestra ambas.','Lo que el ARN puede hacer hoy en un laboratorio no reconstruye lo que ocurrió hace miles de millones de años.'],
'Apoya la hipótesis porque esta propone que el ARN desempeñó inicialmente dos funciones que hoy están repartidas: almacenar información (aquí, copiar una secuencia) y catalizar reacciones (aquí, acelerar una reacción), como hacen las ribozimas. Que una misma molécula reúna ambas funciones hace plausible una etapa anterior al sistema ADN-proteínas. Pero no lo demuestra: el experimento muestra lo que puede hacer el ARN en condiciones de laboratorio, no lo que ocurrió en la Tierra primitiva; la copia es solo parcial y no hay metabolismo ni compartimento. Es un dato compatible con la hipótesis, no una reconstrucción histórica, y las hipótesis sobre el origen de la vida no son excluyentes.',
'Presentar la hipótesis del mundo de ARN como un hecho demostrado.'],
[0,4,'Vesículas de lípidos','Unas vesículas de lípidos se forman espontáneamente en agua, incorporan moléculas del medio y se dividen cuando alcanzan cierto tamaño. ¿Deben considerarse células vivas? Justifica la respuesta indicando qué ventaja aporta la compartimentación y qué propiedades fundamentales faltaría demostrar.',
['Protocélulas y compartimentación.','Se forman espontáneamente, incorporan moléculas y se dividen al crecer.','Separar un interior del medio permite concentrar moléculas y coordinar reacciones.','Dividirse físicamente no es reproducirse con herencia: faltan metabolismo y sistema de herencia.'],
'No deben considerarse células vivas. La compartimentación aporta una ventaja importante: separa un interior del medio, lo que permite concentrar moléculas y coordinar reacciones. Pero crecer, incorporar moléculas e incluso dividirse físicamente no es reproducirse como un ser vivo. Faltaría demostrar que poseen metabolismo propio y un sistema de herencia que transmita información a las vesículas hijas y permita la reproducción con variación. Son un modelo de protocélula compatible con la hipótesis, no una célula.',
'Pensar que toda división es reproducción biológica.'],
[0,5,'LUCA','Todos los seres vivos actuales emplean ribosomas, un código genético casi universal y mecanismos relacionados para expresar la información genética. Explica cómo permite este dato inferir la existencia de LUCA y por qué no permite afirmar que LUCA fuera el primer ser vivo.',
['LUCA: último antepasado común universal.','«Todos los seres vivos actuales» comparten ribosomas y un código casi universal.','Rasgos complejos compartidos por todos → heredados de una población ancestral común.','Si LUCA ya tenía ribosomas, código y membrana, era complejo: tuvo que haber una historia anterior.'],
'Que todos los seres vivos actuales compartan rasgos tan complejos como los ribosomas, un código genético casi universal y mecanismos parecidos de expresión génica se explica de forma más sencilla si los heredaron de un antepasado común, en lugar de suponer que surgieron de forma idéntica muchas veces. Ese antepasado es LUCA, la población ancestral de la que proceden todos los organismos actuales. Pero el mismo dato muestra por qué no fue el primer ser vivo: LUCA ya poseía código genético, ribosomas, membrana y un metabolismo complejo, lo que supone una historia evolutiva previa. LUCA es el último antepasado común de la vida actual; pudieron existir antes otros sistemas vivos o linajes sin descendientes hoy.',
'Decir que LUCA fue el primer ser vivo o una especie única aislada.'],
[0,6,'Gran Oxidación','La acumulación de oxígeno durante la Gran Oxidación tuvo efectos opuestos sobre distintos organismos. Explica por qué pudo perjudicar a muchos anaerobios y, al mismo tiempo, favorecer nuevas formas de metabolismo y la posterior colonización de ambientes superficiales y terrestres.',
['Fotosíntesis oxigénica, Gran Oxidación, respiración aerobia y ozono.','«Efectos opuestos», «anaerobios», «nuevas formas de metabolismo», «ambientes superficiales y terrestres».','Antepasados de las cianobacterias liberan O₂ → presión selectiva sobre anaerobios / ventaja para aerobios → O₂ forma O₃ → menos UV.','El mismo cambio perjudica a unos y favorece a otros; no ocurrió «para» permitir la vida compleja.'],
'Antepasados de las cianobacterias realizaron fotosíntesis oxigénica y liberaron O₂, que se acumuló en la atmósfera (Gran Oxidación, ≈2400 Ma). Para muchos anaerobios, que obtenían energía sin O₂ y para los que el oxígeno podía resultar perjudicial, supuso una fuerte presión selectiva. Al mismo tiempo, favoreció a los organismos con respiración aerobia, que utiliza O₂ y obtiene mucha más energía de los nutrientes, lo que pudo favorecer formas de vida más complejas. Además, parte del O₂ formó ozono (O₃) en las capas altas de la atmósfera; la capa de ozono absorbió gran parte de la radiación ultravioleta que daña el ADN, lo que facilitó la expansión de la vida hacia ambientes superficiales y, más tarde, terrestres.',
'Explicaciones finalistas («el oxígeno apareció para que hubiera vida compleja») o decir que benefició a todos.'],
[0,7,'Antibiótico y orgánulos','Un antibiótico que bloquea ribosomas bacterianos también altera la síntesis de proteínas en mitocondrias y cloroplastos, pero no en los ribosomas del citoplasma eucariota. Relaciona esta observación con la teoría endosimbiótica y aclara qué parte del origen de la célula eucariota no explica dicha teoría de forma demostrada.',
['Teoría endosimbiótica (Lynn Margulis); ribosomas 70S y 80S.','Afecta a ribosomas bacterianos, mitocondriales y de cloroplastos, pero NO a los del citoplasma eucariota.','Ribosomas de los orgánulos semejantes a los bacterianos (70S) → apoya su origen bacteriano.','No explica de forma demostrada el origen del núcleo ni del sistema de endomembranas.'],
'El antibiótico actúa sobre ribosomas de tipo bacteriano (70S). Que afecte también a mitocondrias y cloroplastos, pero no a los ribosomas del citoplasma eucariota (80S), indica que los ribosomas de estos orgánulos se parecen a los bacterianos. Es coherente con la teoría endosimbiótica de Lynn Margulis: mitocondrias y cloroplastos proceden de bacterias incorporadas por una célula ancestral (la mitocondria, de una bacteria aerobia; el cloroplasto, de una cianobacteria). Este dato se suma a otras evidencias: ADN propio circular, división por fisión, doble membrana y, la más concluyente, las comparaciones moleculares de sus genes. La teoría no explica de forma demostrada el origen del núcleo ni del sistema de endomembranas, que sigue investigándose.',
'Afirmar que la endosimbiosis explica también el origen del núcleo.'],
[1,8,'Picos de aves','En una población de aves existen picos de distinto tamaño. Durante varios años secos predominan semillas grandes y duras, pero después llegan años húmedos con abundancia de semillas pequeñas. Predice cómo podría variar el éxito reproductivo de los distintos fenotipos y explica por qué la adaptación no es una cualidad absoluta.',
['Selección natural y adaptación.','Hay variación de picos; primero años secos (semillas duras), después húmedos (semillas pequeñas).','Variación heredable → distinto éxito al alimentarse → más descendientes de unos fenotipos → cambian las frecuencias.','Lo que es ventajoso depende del ambiente: si cambia, la ventaja puede invertirse.'],
'En la población ya existe variación en el tamaño del pico, en parte heredable. En los años secos, con semillas grandes y duras, los individuos de pico grande se alimentan mejor, sobreviven más y dejan en promedio más descendientes, de modo que aumenta la frecuencia de picos grandes. Cuando llegan los años húmedos con abundancia de semillas pequeñas, la ventaja puede invertirse y los de pico más pequeño tener mayor éxito reproductivo. Por eso la adaptación no es absoluta: un rasgo es ventajoso o no en un ambiente concreto, y lo que es adaptativo en un periodo puede dejar de serlo en otro. La selección cambia la población a lo largo de generaciones; no transforma a cada ave.',
'Decir que las aves «cambian el pico para adaptarse» o que existe un pico «mejor» en general.'],
[1,9,'Insecticida','Antes de utilizar un insecticida ya existe en una población un alelo raro que reduce la sensibilidad al producto. Tras varias generaciones de tratamiento aumenta su frecuencia. Explica el origen de la variación y el papel del insecticida sin afirmar que la sustancia produjo la mutación porque los insectos la necesitaban.',
['Mutación no dirigida y selección natural.','El alelo YA existía antes del insecticida; su frecuencia aumenta durante varias generaciones.','Mutación aleatoria previa → el insecticida mata sobre todo a los sensibles → los portadores se reproducen más → aumenta la frecuencia.','El insecticida es agente de selección, no la causa de la mutación.'],
'La variación procede de una mutación que originó el alelo de resistencia antes de usar el insecticida; las mutaciones no están dirigidas por las necesidades del organismo. El insecticida actúa como agente de selección: elimina sobre todo a los insectos sensibles, mientras que los portadores del alelo raro sobreviven en mayor proporción y dejan más descendientes. Generación tras generación, el alelo aumenta su frecuencia en la población. El insecticida no produjo la mutación: seleccionó una variante heredable que ya existía, igual que ocurre con la resistencia bacteriana a los antibióticos.',
'«Los insectos mutaron para sobrevivir» o «el insecticida los volvió resistentes».'],
[1,10,'Polen viajero','El polen de una población numerosa llega cada año a una población pequeña y aislada de la misma especie. Razona cómo este flujo génico puede modificar las frecuencias alélicas de la población pequeña y por qué puede frenar su diferenciación respecto a la población de origen.',
['Flujo génico; diferenciación y especiación.','Población numerosa → población pequeña y aislada; ocurre cada año.','El polen introduce alelos al fecundar → las frecuencias de la población pequeña se acercan a las de la grande.','Para diferenciarse hace falta que disminuya el flujo génico; mientras entre polen, las diferencias se diluyen.'],
'El polen transporta alelos de la población numerosa a la pequeña y, al fecundar sus flores, los incorpora: es flujo génico, la entrada de alelos por migración y reproducción. Como llega cada año desde una población grande, las frecuencias alélicas de la población pequeña tienden a acercarse a las de la población de origen, y puede recuperar alelos que habría perdido por deriva genética. Esto frena su diferenciación, porque para que dos poblaciones diverjan, y llegar a formar especies distintas, tiene que disminuir el flujo génico. Mientras siga entrando polen, las diferencias que acumule la población pequeña se diluyen.',
'Confundir flujo génico con deriva o pensar que el polen «crea» nuevas mutaciones.'],
[1,11,'Luz y tamaño','Dos plantas con el mismo genotipo crecen en ambientes diferentes: una recibe abundante luz y la otra permanece a la sombra, por lo que alcanzan tamaños distintos. Explica por qué esta diferencia fenotípica no constituye por sí sola evolución y qué tendría que ocurrir para que un cambio contribuyera directamente a la evolución de la población.',
['Variabilidad: genes, ambiente e interacción; definición de evolución.','«Mismo genotipo» → la diferencia es ambiental.','Evolución = cambio de características hereditarias de una población a lo largo de generaciones.','Haría falta variación heredable y que cambiaran las frecuencias alélicas en generaciones sucesivas.'],
'Las dos plantas tienen el mismo genotipo, así que la diferencia de tamaño se debe al ambiente (la luz), no a los genes. Solo la parte heredable de la variación puede transmitirse y contribuir directamente al cambio evolutivo. Además, la evolución es el cambio de las características hereditarias de una población a lo largo de generaciones: un individuo que cambia durante su vida no evoluciona. Para que hubiera evolución tendría que existir variación genética heredable relacionada con el tamaño y que, generación tras generación, cambiara su frecuencia en la población, por ejemplo porque los portadores de ciertas variantes dejaran más descendientes (selección) o por deriva o flujo génico.',
'Confundir un cambio en un individuo con la evolución de una población.'],
[2,12,'Aves no voladoras','Dos aves no voladoras de islas muy alejadas se parecen entre sí, pero los datos anatómicos y moleculares muestran que cada una está más emparentada con aves voladoras de su continente más próximo. Explica cómo pueden combinarse biogeografía, parentesco y evolución convergente para interpretar este resultado.',
['Biogeografía, homología/analogía y convergencia.','Se parecen entre sí, PERO los datos anatómicos y moleculares las emparentan con aves de su continente.','Cada isla fue colonizada desde su continente cercano → cada linaje divergió → presiones semejantes produjeron rasgos parecidos.','Conclusión basada en los datos: el parecido es una analogía, no indica parentesco cercano entre ellas.'],
'Biogeografía: las especies de islas suelen parecerse a las del continente más cercano, porque proceden de poblaciones que lo colonizaron y después divergieron; aquí cada isla fue colonizada desde su continente. Parentesco: los datos anatómicos y moleculares sitúan a cada ave no voladora en el linaje de las aves voladoras de su continente, así que no son parientes cercanas entre sí. Evolución convergente: en dos linajes distintos, presiones semejantes en ambientes insulares favorecieron rasgos parecidos, como la pérdida del vuelo, que son analogías. Conclusión: su semejanza se debe a convergencia, y el parentesco lo indican las homologías y los datos moleculares, no el parecido externo.',
'Concluir que se parecen porque son parientes cercanas: el enunciado da datos que lo descartan.'],
[2,13,'Tiburón y delfín','Un tiburón y un delfín poseen una forma corporal hidrodinámica semejante. Sin embargo, el esqueleto de la aleta del delfín comparte el mismo plan básico que la extremidad de otros mamíferos y las secuencias de ADN lo sitúan con ellos. Distingue qué semejanzas son analogías y cuáles reflejan homología, y explica por qué las evidencias moleculares y anatómicas profundas pesan más que la forma externa.',
['Estructuras homólogas y análogas; evidencias moleculares.','Forma hidrodinámica común; aleta con el plan de la extremidad de mamíferos; ADN que lo sitúa con los mamíferos.','Analogía = convergencia por un medio similar. Homología = mismo plan estructural heredado.','La forma externa puede repetirse en linajes distintos; las homologías y el ADN reflejan ascendencia común.'],
'La forma corporal hidrodinámica es una analogía: función y aspecto semejantes con origen evolutivo distinto, producida por convergencia en un medio similar. En cambio, el esqueleto de la aleta del delfín comparte el plan básico de la extremidad anterior de otros mamíferos (como el brazo humano o el ala del murciélago): es una homología, que refleja un antepasado común. Las secuencias de ADN, otra evidencia independiente, también lo sitúan con los mamíferos. Las homologías profundas y los datos moleculares pesan más porque se heredan de antepasados comunes y permiten estimar parentesco, mientras que una forma externa parecida puede surgir en linajes distintos sometidos a presiones semejantes.',
'Usar la semejanza externa como prueba de parentesco.'],
[2,14,'Poliploidía','En una población vegetal aparece un individuo poliploide cuyos descendientes pueden reproducirse entre sí, pero no producen descendencia fértil con las plantas diploides que viven en el mismo lugar. Identifica el tipo de especiación que podría iniciarse y explica cómo surge el aislamiento reproductivo sin una barrera geográfica.',
['Especiación simpátrica por poliploidía; barreras postcigóticas.','Viven en el mismo lugar; fértiles entre sí, pero sin descendencia fértil con las diploides.','Aumento del número de juegos de cromosomas → híbridos no fértiles → se interrumpe el flujo génico.','No hace falta barrera física: el aislamiento es genético.'],
'Podría iniciarse una especiación simpátrica, porque ocurre sin separación geográfica: el poliploide y las plantas diploides viven en el mismo lugar. La poliploidía, un aumento del número de juegos de cromosomas, hace que los descendientes del poliploide sean fértiles entre sí pero no produzcan descendencia fértil con las diploides. Esa incompatibilidad actúa como barrera postcigótica (el híbrido no es fértil) e impide el flujo génico entre ambos grupos. Así aparece aislamiento reproductivo sin barrera física, y el nuevo grupo puede evolucionar como una especie distinta.',
'Clasificarla como alopátrica o pensar que hace falta una barrera geográfica.'],
[2,15,'Cantos de ranas','Dos poblaciones de ranas comparten la misma charca y sus gametos son compatibles, pero utilizan cantos de cortejo diferentes y normalmente no se aparean entre sí. En el laboratorio pueden cruzarse y originar descendencia fértil. Identifica la barrera que actúa en la naturaleza y razona si el cruce artificial basta para negar que exista un proceso de especiación.',
['Barreras precigóticas; concepto biológico de especie.','Misma charca; gametos compatibles; cantos distintos; en laboratorio, descendencia fértil.','Cantos distintos → no se reconocen → no se aparean → no hay flujo génico en la naturaleza.','El concepto biológico se refiere a condiciones naturales: el laboratorio no prueba que haya flujo génico real.'],
'Actúa una barrera precigótica etológica (de comportamiento): cada población utiliza cantos de cortejo diferentes y los individuos del otro grupo no los reconocen, de modo que no se aparean aunque compartan la charca y sus gametos sean compatibles. El cruce en el laboratorio no basta para negar la especiación, porque el concepto biológico de especie se refiere a la reproducción en condiciones naturales. Si en la naturaleza no intercambian genes, el flujo génico está interrumpido y puede estar en marcha una especiación simpátrica. Que en el laboratorio den descendencia fértil solo indica que todavía no hay barreras postcigóticas.',
'Decir que, como en el laboratorio son fértiles, son necesariamente una sola especie sin especiación.'],
[2,16,'Radiación evolutiva','Después de una extinción masiva quedan numerosos nichos ecológicos disponibles. Un linaje superviviente se diversifica en especies con dietas y modos de vida distintos. Explica por qué este proceso se considera una radiación evolutiva y evita presentarlo como una respuesta dirigida a la «necesidad» de rellenar los nichos.',
['Radiación evolutiva; extinción masiva (por ejemplo, K-Pg).','Muchos nichos disponibles; un linaje da varias especies con dietas y modos de vida distintos.','Variación heredable + menos competencia → distintas variantes dejan más descendientes en ambientes distintos → poblaciones divergen → especiación.','Los nichos libres son oportunidades, no una necesidad que dirija el cambio; la diversificación no estaba garantizada.'],
'Es una radiación evolutiva porque un linaje ancestral se diversifica en varias especies con modos de vida distintos al quedar disponibles numerosos nichos ecológicos, como les ocurrió a aves y mamíferos tras la extinción K-Pg. Sin finalismo: en las poblaciones del linaje ya existía variación heredable; al desaparecer otros grupos, los individuos con variantes que permitían aprovechar recursos distintos dejaron más descendientes en cada ambiente; las poblaciones dejaron de intercambiar genes, acumularon diferencias y originaron especies nuevas. Los nichos vacíos son oportunidades que cambian la selección, no una «necesidad» que dirija el cambio, y la diversificación no estaba garantizada.',
'«Evolucionaron para ocupar los nichos vacíos».'],
[2,17,'Dos reservas','Dos reservas albergan el mismo número de individuos de una especie amenazada. En una, las poblaciones están conectadas por corredores; en la otra permanecen pequeñas y aisladas. Predice en cuál será más fácil conservar la diversidad genética a largo plazo y explica el papel del flujo génico y del tamaño poblacional.',
['Diversidad genética, flujo génico, deriva genética y conservación.','Mismo número total de individuos; una reserva con corredores y otra con poblaciones pequeñas y aisladas.','Corredores → flujo génico → los alelos circulan. Poblaciones pequeñas y aisladas → deriva → pérdida de alelos sin reposición.','Más diversidad genética da más posibilidades frente a enfermedades o cambios, pero no garantiza la supervivencia.'],
'Será más fácil en la reserva con corredores. Los corredores conectan las poblaciones y permiten el flujo génico: los alelos circulan entre ellas, lo que mantiene su variedad y compensa las pérdidas locales. En la otra reserva, aunque el número total de individuos sea el mismo, cada población es pequeña y aislada: la deriva genética tiene más efecto y, por azar, algunos alelos pueden desaparecer sin que el flujo génico los reponga. Por eso conservar la biodiversidad no consiste en salvar individuos aislados, sino en mantener poblaciones suficientemente grandes y conectadas. Una mayor diversidad genética suele dar más posibilidades de responder a enfermedades o cambios ambientales, aunque no garantiza la supervivencia.',
'Pensar que solo importa el número total de individuos.'],
[3,18,'Felidae','En la expresión «la familia Felidae incluye los géneros Panthera y Felis», distingue cuáles son las categorías taxonómicas y cuáles son los taxones concretos. Explica además por qué una categoría no es un grupo de organismos por sí misma.',
['Categoría taxonómica frente a taxón.','«familia», «Felidae», «géneros», «Panthera», «Felis».','Categorías = niveles (familia, género). Taxones = grupos concretos en esos niveles (Felidae, Panthera, Felis).','Una categoría es un rango de la jerarquía; los organismos se agrupan en taxones.'],
'Las categorías taxonómicas son «familia» y «género», que son niveles de la jerarquía. Los taxones concretos son Felidae (taxón de categoría familia) y Panthera y Felis (taxones de categoría género). Una categoría no es un grupo de organismos por sí misma: es un nivel o rango de la clasificación, como un piso de un edificio. Los organismos se agrupan en taxones, que son los grupos concretos colocados en cada nivel. Por eso «familia» no contiene animales, pero Felidae sí. Igual que Mammalia es un taxón de categoría clase u Homo sapiens un taxón de categoría especie.',
'Tratar «familia» como si fuera un grupo de animales o confundir Felidae con una categoría.'],
[3,19,'Cladograma','En un cladograma, un carácter aparece antes del nudo que reúne a cuatro especies, pero una de ellas no lo presenta en la actualidad. Propón una explicación compatible con el árbol y razona por qué la ausencia actual del carácter no obliga necesariamente a colocar esa especie fuera del grupo.',
['Lectura de cladogramas; clado; pérdidas posteriores.','El carácter está antes del nudo de cuatro especies; una no lo tiene hoy.','Carácter presente en el antepasado común → perdido después en el linaje de una especie (pérdida secundaria).','El parentesco se deduce del patrón de nudos y de muchos caracteres, no de uno solo.'],
'Un carácter situado antes de un nudo se espera en todos sus descendientes, salvo pérdidas posteriores. Una explicación compatible es que el carácter estaba en el antepasado común de las cuatro especies y se perdió después en el linaje de una de ellas. Su ausencia actual no obliga a sacarla del grupo, porque el parentesco se deduce del patrón de nudos y de los caracteres compartidos, y esa especie sigue descendiendo del mismo antepasado común. Un clado incluye un antepasado y todos sus descendientes, aunque alguno haya perdido un carácter, igual que algunas aves no voladoras conservan alas reducidas (estructuras vestigiales).',
'Sacar del grupo a la especie solo porque le falta un carácter.'],
[3,20,'Dos microorganismos','Se analizan dos microorganismos. El organismo A carece de núcleo, posee membranas con lípidos unidos por enlaces éter y no tiene peptidoglicano; vive en un suelo corriente. El organismo B tiene núcleo, cloroplastos y flagelo, realiza fotosíntesis y es unicelular. Clasifica A en uno de los tres dominios y sitúa B en la agrupación didáctica más adecuada. Justifica por qué el ambiente de A y la fotosíntesis de B, considerados por separado, no bastan para clasificarlos correctamente.',
['Tres dominios; protoctistas como agrupación didáctica.','A: sin núcleo, lípidos con enlaces éter, sin peptidoglicano, suelo corriente. B: núcleo, cloroplastos, flagelo, fotosíntesis, unicelular.','A → caracteres celulares y moleculares de Archaea. B → eucariota unicelular fotosintético → protoctista (alga).','No todas las arqueas son extremófilas; la fotosíntesis la hacen cianobacterias, algas y plantas.'],
'A pertenece al dominio Archaea: no tiene núcleo (es procariota), sus membranas tienen lípidos unidos por enlaces éter y su pared no contiene peptidoglicano, rasgos que lo separan de Bacteria. B es eucariota (tiene núcleo y cloroplastos), unicelular, fotosintético y con flagelo: encaja en los protoctistas, en concreto en las algas unicelulares, una agrupación didáctica que no forma un clado natural. Ninguno de los dos datos basta por separado: no todas las arqueas son extremófilas (también viven en suelos, océanos e intestinos), así que vivir en un suelo corriente no excluye Archaea; y la fotosíntesis la realizan cianobacterias, algas y plantas, de modo que no convierte a B en planta (las plantas son pluricelulares con tejidos). Hay que clasificar por caracteres celulares y moleculares.',
'Clasificar A como bacteria por no vivir en un ambiente extremo, o B como planta por hacer fotosíntesis.']
];

let c=document.getElementById('missions');lessons.forEach((m,i)=>{const nq=qs.filter(q=>q[0]===i).length,nc=caseList.filter(x=>x[0]===i).length;const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="num">0${i+1}</div><div class="symbol">${m.icon}</div><h3>${m.title}</h3><p>${m.sub}</p><div class="tags"><span class="tag">${m.facts.length} conceptos</span><span class="tag">${nq} preguntas</span>${nc?`<span class="tag">${nc} actividades</span>`:''}</div><div class="btnrow"></div>`;el.querySelector('.btnrow').append(btn('Entrar en misión',()=>go('lesson',i),'primary'));c.append(el)});

mountButtons('lessonNav',[['← Volver al mapa',()=>go('home')],['Practicar preguntas',()=>go('quiz',state.mission),'primary']]);mountButtons('lessonEnd',end)}

const {q,i}=list[state.qi];app.innerHTML=`<section class="panel"><div class="eyebrow">Misión 0${state.mission+1} · Pregunta ${state.qi+1} de ${list.length}</div><div class="progress"><div style="width:${100*state.qi/list.length}%"></div></div><p class="question">${escapeHtml(q[1])}</p><div class="options" id="opts"></div><div id="feed"></div><div class="btnrow" id="quizNav"></div></section>`;

function choose(j,q,i){if(state.answered)return;state.answered=true;state.selected=j;const correct=j===q[3];if(correct){saved['q_'+i]=true;persist()}document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add('good');else if(k===j)b.classList.add('bad')});const f=document.getElementById('feed');f.className='feedback';f.innerHTML=`<strong>${correct?'✓ Correcto':'✗ Todavía no'}</strong><p>${escapeHtml(q[4])}</p><p class="small">${correct?'La evidencia y el mecanismo están bien relacionados.':'Compara tu elección con la respuesta marcada en verde. La explicación debe descartar las alternativas.'}</p>`;f.append(btn('Siguiente pregunta →',()=>{state.qi++;state.answered=false;quiz()},'primary'))}
function cases(){let idx=state.caseIndex;if(idx<0||idx>=caseList.length)idx=state.caseIndex=0;const [m,n,t,q,steps,model,err]=caseList[idx];const draft=saved['w_'+n]||'';const h=state.hints;
app.innerHTML=`<section class="panel"><div class="eyebrow">Actividad ${n} de 20 · Bloque ${escapeHtml(BLOCK[blockOf(n)])}</div><div class="progress"><div style="width:${100*(idx+1)/caseList.length}%"></div></div><h2>${escapeHtml(t)}</h2><p class="question">${escapeHtml(q)}</p><label for="written" class="muted">Escribe tu respuesta (4–8 frases). Usa los datos del enunciado, explica el mecanismo y di qué se puede concluir y qué no.</label><textarea id="written" class="answer" placeholder="Mi explicación científica es...">${escapeHtml(draft)}</textarea><div class="btnrow" id="hintBtns"></div><div id="hintBox">${h?`<div class="hintbox">${steps.slice(0,h).map((s,k)=>`<p><strong>${STEP_NAMES[k]}</strong><br>${escapeHtml(s)}</p>`).join('')}</div>`:''}</div><div id="solution" class="feedback ${state.showSolution?'':'hidden'}"><h3>Razonamiento paso a paso</h3><ol class="steps">${steps.map((s,k)=>`<li><strong>${STEP_NAMES[k]}</strong><br>${escapeHtml(s)}</li>`).join('')}</ol><h3>Respuesta modelo</h3><p>${escapeHtml(model)}</p><p class="warnline">🚫 Error que debes evitar: ${escapeHtml(err)}</p><div class="rubric"><strong>Autoevaluación según «Cómo responder» de tu profesora</strong>${RUBRIC.map((r,k)=>`<label class="checkrow"><input type="checkbox" id="rb${k}" ${(saved['r_'+n]||[]).includes(k)?'checked':''}> ${escapeHtml(r)}</label>`).join('')}<p class="result" id="rubScore"></p></div></div><div class="btnrow" id="caseBtns"></div></section>`;
const ta=document.getElementById('written');ta.addEventListener('input',()=>{saved['w_'+n]=ta.value;persist()});
const hb=[];if(h<4)hb.push([`💡 Pista ${h+1} de 4`,()=>{state.hints++;cases()}]);if(!state.showSolution)hb.push(['Ver razonamiento y respuesta modelo',()=>{state.showSolution=true;state.hints=4;cases()},'primary']);mountButtons('hintBtns',hb);
const upd=()=>{const ticks=RUBRIC.map((_,k)=>k).filter(k=>document.getElementById('rb'+k).checked);saved['r_'+n]=ticks;persist();document.getElementById('rubScore').textContent=`${ticks.length}/5 criterios cumplidos${ticks.length===5?' · ¡Respuesta de 10! 🏅':''}`};
if(state.showSolution){RUBRIC.forEach((_,k)=>document.getElementById('rb'+k).addEventListener('change',upd));const prev=saved['r_'+n];if(prev)document.getElementById('rubScore').textContent=`${prev.length}/5 criterios cumplidos`}
mountButtons('caseBtns',[['← Anterior',()=>{state.caseIndex=(idx+caseList.length-1)%caseList.length;state.hints=0;state.showSolution=false;casesView()}],['Siguiente →',()=>{state.caseIndex=(idx+1)%caseList.length;state.hints=0;state.showSolution=false;casesView()},'primary'],['Conceptos de esta misión',()=>go('lesson',m)],['Mapa',()=>go('home')]])}
function casesView(){cases();scrollTo(0,0)}
function render(){if(state.view==='home')home();else if(state.view==='lesson')lesson();else if(state.view==='quiz')quiz();else cases()}
document.getElementById('homeBtn').addEventListener('click',()=>go('home'));
document.getElementById('resetBtn').addEventListener('click',()=>{const box=document.getElementById('resetConfirm');if(box){box.remove();return}const d=document.createElement('div');d.id='resetConfirm';d.className='panel';d.innerHTML='<p>¿Borrar las respuestas y el progreso guardados en este navegador?</p><div class="btnrow" id="rcBtns"></div>';app.prepend(d);mountButtons('rcBtns',[['Sí, borrar',()=>{saved={};persist();go('home')},'primary'],['Cancelar',()=>d.remove()]]);scrollTo(0,0)});
render();

</script></body></html>
